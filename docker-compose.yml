services:
  # Datenbank
  db:
    image: postgres:13
    restart: always
    environment:
      - POSTGRES_DB=testdb
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  # Microservices
  microservice1:
    build:
      context: ./microservice1
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - LOGSTASH_HOST=logstash
    depends_on:
      - db
      - jaeger-agent
      - logstash

  microservice2:
    build:
      context: ./microservice2
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - LOGSTASH_HOST=logstash
    depends_on:
      - db
      - jaeger-agent
      - logstash

  # Frontend
  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - microservice1

  # Monitoring-Stack
  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
      - jaeger-query
      - elasticsearch

  # Jaeger Dienste
  jaeger-cassandra:
    image: cassandra:3.11
    ports:
      - "9042:9042"
    volumes:
      - jaeger-cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "[ $(nodetool status | grep -c \"UN \") -gt 0 ]"]
      interval: 10s
      timeout: 10s
      retries: 5 

  jaeger-agent:
    image: jaegertracing/jaeger-agent
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
    depends_on:
      - jaeger-collector

  jaeger-collector:
    image: jaegertracing/jaeger-collector
    ports:
      - "14267:14267"
      - "14268:14268"
    environment:
      - COLLECTOR_ZIPKIN_HTTP_PORT=9411
    command: ["--cassandra.servers=jaeger-cassandra"]
    depends_on:
      - jaeger-cassandra

  jaeger-query:
    image: jaegertracing/jaeger-query
    ports:
      - "16686:16686"
    command: ["--cassandra.servers=jaeger-cassandra"]
    depends_on:
      - jaeger-cassandra

  # ELK Stack
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=changeme
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m" # Heap-Größe begrenzen
    ports:
      - "9200:9200"

  logstash:
    image: docker.elastic.co/logstash/logstash:7.17.0
    container_name: logstash
    ports:
      - "5001:5000"
    volumes:
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    environment:
      - ELASTICSEARCH_HOSTS=elasticsearch
    depends_on:
      - elasticsearch

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.0
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
      
volumes:
  db-data:
  jaeger-cassandra-data: