services:
  # Datenbank
  db:
    image: postgres:13
    restart: always
    environment:
      - POSTGRES_DB=testdb
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  # Microservice 1
  microservice1:
    build:
      context: ./microservice1
    ports:
      - "8081:8081"
    environment:
      - LOGSTASH_HOST=logstash
      - SPRING_PROFILES_ACTIVE=dev
      - JAEGER_AGENT_HOST=jaeger-all-in-one # Ziel ist der neue All-in-One-Service
    depends_on:
      - db
      - jaeger-all-in-one # Abhängig vom neuen Jaeger-Service
      - logstash

  # Microservice 2
  microservice2:
    build:
      context: ./microservice2
    ports:
      - "8082:8082"
    environment:
      - LOGSTASH_HOST=logstash
      - SPRING_PROFILES_ACTIVE=dev
      - JAEGER_AGENT_HOST=jaeger-all-in-one # Ziel ist der neue All-in-One-Service
    depends_on:
      - db
      - jaeger-all-in-one # Abhängig vom neuen Jaeger-Service
      - logstash

  # Frontend
  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - microservice1

  # Monitoring-Stack
  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
      - jaeger-all-in-one # Abhängig vom neuen Jaeger-Service
      - elasticsearch

  # Jaeger V2 All-in-One Dienst (ersetzt Agent, Collector, Query)
  jaeger-all-in-one:
    image: jaegertracing/jaeger:2.6.0 # Eine stabile V2-Version
    container_name: jaeger-all-in-one
    ports:
      - "16686:16686" # Web UI
      - "14250:14250" # gRPC Collector
      - "6831:6831/udp" # Agent Thrift UDP
    environment:
      - COLLECTOR_ZIPKIN_HTTP_PORT=9411
      - JAEGER_DISABLED=false
      - STORAGE=cassandra # V2-Konfiguration für Cassandra
      - CASSANDRA_SERVERS=jaeger-cassandra # Verweist auf den Cassandra-Dienst
    depends_on:
      jaeger-cassandra:
        condition: service_healthy # Wartet, bis Cassandra bereit ist

  # Cassandra
  jaeger-cassandra:
    image: cassandra:3.11
    ports:
      - "9042:9042"
    volumes:
      - jaeger-cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "[ $(nodetool status | grep -c \"UN \") -gt 0 ]"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ELK Stack
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=changeme
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"

  logstash:
    image: docker.elastic.co/logstash/logstash:7.17.0
    container_name: logstash
    ports:
      - "5001:5000"
    volumes:
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    environment:
      - ELASTICSEARCH_HOSTS=elasticsearch
    depends_on:
      - elasticsearch

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.0
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch

volumes:
  db-data:
  jaeger-cassandra-data: